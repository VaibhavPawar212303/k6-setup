name: AWS EC2 Workflow

on:
  workflow_dispatch:

jobs:
  manage-ec2-instance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Verify and Start Instance
        run: |
          INSTANCE_ID="i-0e3f6782567fea03a"
          REGION="us-east-1"

          # Ensure the instance is running
          STATE=$(aws ec2 describe-instances --instance-ids $INSTANCE_ID --region $REGION --query "Reservations[*].Instances[*].State.Name" --output text)
          if [ "$STATE" != "running" ]; then
            echo "Starting instance $INSTANCE_ID..."
            aws ec2 start-instances --instance-ids $INSTANCE_ID --region $REGION
            aws ec2 wait instance-running --instance-ids $INSTANCE_ID --region $REGION
          fi
          echo "Instance $INSTANCE_ID is running."

      - name: Connect to Instance and List Directory
        run: |
          INSTANCE_ID="i-0e3f6782567fea03a"
          REGION="us-east-1"
          SSH_KEY="~/.ssh/aws_key.pem"

          # Retrieve the public DNS of the instance
          PUBLIC_DNS=$(aws ec2 describe-instances --instance-ids $INSTANCE_ID --region $REGION --query "Reservations[*].Instances[*].PublicDnsName" --output text)

          if [ -z "$PUBLIC_DNS" ]; then
            echo "Public DNS for instance $INSTANCE_ID is not available."
            exit 1
          fi

          echo "Connecting to instance $INSTANCE_ID at $PUBLIC_DNS..."

          # List directory contents
          ssh -i $SSH_KEY -o StrictHostKeyChecking=no ec2-user@$PUBLIC_DNS "ls -al"
        env:
          AWS_DEFAULT_REGION: us-east-1
