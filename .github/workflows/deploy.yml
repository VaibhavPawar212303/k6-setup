name: Check EC2 Instance Directory

on:
  push:
    branches:
      - main

jobs:
  check-directory:
    runs-on: ubuntu-latest

    steps:
    - name: Set up AWS CLI
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1  # Replace with your EC2 region

    - name: Check directory in EC2 instance
      run: |
        INSTANCE_ID="i-0e3f6782567fea03a"
        COMMAND="ls"
        COMMAND_OUTPUT=$(aws ssm send-command --instance-ids $INSTANCE_ID --document-name "AWS-RunShellScript" --parameters "commands=[\"$COMMAND\"]" --query "CommandInvocations[0].CommandPlugins[0].Output" --output text)
        echo "Directory contents of $DIRECTORY:"
        echo "$COMMAND_OUTPUT"
