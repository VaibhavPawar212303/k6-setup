name: Get EC2 Instance by Name

on:
  push:
    branches:
      - main

jobs:
  retrieve-instance-by-name:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set up AWS CLI
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1  # Use a valid region here

    - name: Get EC2 Instance by Name
      run: |
        echo "Fetching EC2 instance with the name 'v'..."
        aws ec2 describe-instances --filters "Name=tag:Name,Values=v" --query "Reservations[*].Instances[*].InstanceId" --output json
