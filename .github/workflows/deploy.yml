name: AWS EC2 Workflow

on:
  workflow_dispatch:

jobs:
  manage-ec2-instance:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Set up SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.AWS_SSH_PRIVATE_KEY }}" > ~/.ssh/aws_key.pem
          chmod 600 ~/.ssh/aws_key.pem
          echo "SSH key configured."

      - name: Verify and Start Instance
        run: |
          INSTANCE_ID="i-0e3f6782567fea03a"
          REGION="us-east-1"

          # Ensure the instance is running
          STATE=$(aws ec2 describe-instances --instance-ids $INSTANCE_ID --region $REGION --query "Reservations[*].Instances[*].State.Name" --output text)
          if [ "$STATE" != "running" ]; then
            echo "Starting instance $INSTANCE_ID..."
            aws ec2 start-instances --instance-ids $INSTANCE_ID --region $REGION
            aws ec2 wait instance-running --instance-ids $INSTANCE_ID --region $REGION
          fi
          echo "Instance $INSTANCE_ID is running."

      - name: Connect to Instance via IPv6 and List Directory
        run: |
          INSTANCE_ID="i-0e3f6782567fea03a"
          REGION="us-east-1"
          SSH_KEY="~/.ssh/aws_key.pem"

          # Retrieve the IPv6 address of the instance
          IPV6_ADDRESS=$(aws ec2 describe-instances --instance-ids $INSTANCE_ID --region $REGION --query "Reservations[*].Instances[*].NetworkInterfaces[*].Ipv6Addresses[*].Ipv6Address" --output text)

          if [ -z "$IPV6_ADDRESS" ]; then
            echo "IPv6 address for instance $INSTANCE_ID is not available."
            exit 1
          fi

          echo "Connecting to instance $INSTANCE_ID at $IPV6_ADDRESS..."

          # List directory contents
          ssh -i $SSH_KEY vaibhav@$IPV6_ADDRESS "ls -al"
        env:
          AWS_DEFAULT_REGION: us-east-1
