name: Access EC2 Instance via SSH

on:
  push:
    branches:
      - main

jobs:
  access-ec2:
    runs-on: ubuntu-latest

    steps:
    - name: Set up SSH Key
      run: |
        # Create the .ssh directory if it doesn't exist
        mkdir -p ~/.ssh

        # Save the private SSH key as a file
        echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/aws_key.pem

        # Set proper permissions for the key
        chmod 600 ~/.ssh/aws_key.pem

        echo "SSH key configured."

    - name: Verify Instance State
      run: |
        INSTANCE_ID="i-0e3f6782567fea03a"
        # Ensure the instance is running
        STATE=$(aws ec2 describe-instances --instance-ids $INSTANCE_ID --query "Reservations[*].Instances[*].State.Name" --output text)
        if [ "$STATE" != "running" ]; then
          echo "Starting instance $INSTANCE_ID..."
          aws ec2 start-instances --instance-ids $INSTANCE_ID
          aws ec2 wait instance-running --instance-ids $INSTANCE_ID
        fi
        echo "Instance $INSTANCE_ID is running."

    - name: Access EC2 Instance via SSH
      run: |
        INSTANCE_PUBLIC_IP=$(aws ec2 describe-instances \
          --instance-ids i-0e3f6782567fea03a \
          --query "Reservations[*].Instances[*].PublicIpAddress" \
          --output text)
        
        if [ -z "$INSTANCE_PUBLIC_IP" ]; then
          echo "Public IP not found for instance $INSTANCE_ID. Ensure it has a public IP assigned."
          exit 1
        fi
        
        echo "Connecting to instance $INSTANCE_ID at $INSTANCE_PUBLIC_IP..."
        ssh -o StrictHostKeyChecking=no -i ~/.ssh/aws_key.pem ec2-user@$INSTANCE_PUBLIC_IP "ls -la"
      env:
        AWS_DEFAULT_REGION: us-east-1
        AWS_REGION: us-east-1
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
