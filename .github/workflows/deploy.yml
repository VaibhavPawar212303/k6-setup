name: AWS EC2 Workflow

on:
  push:
    branches:
      - aws-cli

jobs:
  manage-ec2-instance:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install AWS CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y awscli

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Set up SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/aws_key.pem
          chmod 600 ~/.ssh/aws_key.pem
          echo "SSH key configured."

      - name: Verify and Start Instance
        run: |
          INSTANCE_ID="i-0e3f6782567fea03a"
          REGION="us-east-1"

          # Ensure the instance is running
          STATE=$(aws ec2 describe-instances --instance-ids $INSTANCE_ID --region $REGION --query "Reservations[*].Instances[*].State.Name" --output text)
          if [ "$STATE" != "running" ]; then
            echo "Starting instance $INSTANCE_ID..."
            aws ec2 start-instances --instance-ids $INSTANCE_ID --region $REGION
            aws ec2 wait instance-running --instance-ids $INSTANCE_ID --region $REGION
          else
            echo "Instance $INSTANCE_ID is already running."
          fi
          echo "Instance $INSTANCE_ID is running."

      - name: Execute command on instance using AWS SSM
        run: |
          INSTANCE_ID="i-0e3f6782567fea03a"
          REGION="us-east-1"
          COMMAND="k6 --version"

          # Send command to EC2 instance using SSM
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids $INSTANCE_ID \
            --document-name "AWS-RunShellScript" \
            --parameters commands=["$COMMAND"] \
            --region $REGION \
            --query "Command.CommandId" \
            --output text)

          # Wait for command to complete
          aws ssm wait command-executed --command-id $COMMAND_ID --instance-id $INSTANCE_ID --region $REGION || {
            echo "Command execution failed."
            aws ssm get-command-invocation \
              --command-id $COMMAND_ID \
              --instance-id $INSTANCE_ID \
              --region $REGION \
              --query "StandardErrorContent" \
              --output text
            exit 1
          }

          # Get command output and print version
          OUTPUT=$(aws ssm get-command-invocation \
            --command-id $COMMAND_ID \
            --instance-id $INSTANCE_ID \
            --region $REGION \
            --query "StandardOutputContent" \
            --output text)
          echo "k6 version:"
          echo "$OUTPUT"
        env:
          AWS_DEFAULT_REGION: us-east-1
          AWS_REGION: us-east-1
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
