name: AWS EC2 Workflow

on:
  workflow_dispatch:

jobs:
  manage-ec2-instance:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install AWS CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y awscli

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Start EC2 Instance with User Data
        run: |
          INSTANCE_ID="i-0e3f6782567fea03a"
          REGION="us-east-1"
          USER_DATA=$(base64 -w 0 <<EOF
          #!/bin/bash
          ls -d */
          EOF
          )

          aws ec2 run-instances \
            --instance-id $INSTANCE_ID \
            --region $REGION \
            --user-data $USER_DATA

      - name: Verify and Start Instance
        run: |
          INSTANCE_ID="i-0e3f6782567fea03a"
          REGION="us-east-1"

          # Ensure the instance is running
          STATE=$(aws ec2 describe-instances --instance-ids $INSTANCE_ID --region $REGION --query "Reservations[*].Instances[*].State.Name" --output text)
          if [ "$STATE" != "running" ]; then
            echo "Starting instance $INSTANCE_ID..."
            aws ec2 start-instances --instance-ids $INSTANCE_ID --region $REGION
            aws ec2 wait instance-running --instance-ids $INSTANCE_ID --region $REGION
          else
            echo "Instance $INSTANCE_ID is already running."
          fi
          echo "Instance $INSTANCE_ID is running."

      - name: Execute command on instance using AWS CLI
        run: |
          INSTANCE_ID="i-0e3f6782567fea03a"
          
          # Wait for SSM agent to be running
          aws ssm wait instance-online --instance-ids $INSTANCE_ID

          # Execute command using SSM Send-Command
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids $INSTANCE_ID \
            --document-name "AWS-RunShellScript" \
            --parameters '{"commands":["ls -al"]}' \
            --output text \
            --query "Command.CommandId")

          # Wait for command completion and get output
          aws ssm wait command-executed --command-id $COMMAND_ID --instance-ids $INSTANCE_ID
          
          # Get command output
          aws ssm get-command-invocation \
            --command-id $COMMAND_ID \
            --instance-id $INSTANCE_ID \
            --query "StandardOutputContent" \
            --output text
